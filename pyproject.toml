[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-web-test-harness"
version = "0.1.0"
description = "Autonomous AI E2E Web Testing Harness powered by Playwright and OpenAI SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "mwdharmaaa", email = "mwdharmaaa@users.noreply.github.com" }
]
dependencies = [
    "openai>=1.30.0",
    "playwright>=1.44.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]

[project.scripts]
ai-harness = "src.cli:main"
